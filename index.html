<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKIN BENCH</title>
<style>
  :root { --bg:#0e0e10; --fg:#e8e6e1; --dim:#8a8880; --line:#26262a; --hi:#d8b45a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { padding:18px 20px 12px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:15px; letter-spacing:.16em; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; margin-top:5px; }
  main { padding:20px; }
  #drop { border:1px dashed #3a3a40; border-radius:10px; padding:34px 18px; text-align:center;
          color:var(--dim); cursor:pointer; transition:border-color .15s, color .15s; }
  #drop.over, #drop:hover { border-color:var(--hi); color:var(--fg); }
  #drop input { display:none; }
  #bar { display:none; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  button { font:inherit; background:#1a1a1e; color:var(--fg); border:1px solid var(--line);
           padding:7px 13px; border-radius:7px; cursor:pointer; }
  button:hover { border-color:var(--hi); }
  #grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
  figure { margin:0; }
  /* ⛔ NOT aspect-ratio:1/1 — object-fit does not apply to canvas CONTENT, so forcing a square
     box stretched every thumbnail. height:auto keeps the photo's real proportions. */
  figure canvas { width:100%; height:auto; display:block; border-radius:7px; background:#151518;
                  cursor:pointer; }
  figcaption { color:var(--dim); font-size:11px; letter-spacing:.10em; margin-top:7px;
               text-transform:uppercase; }
  #view { position:fixed; inset:0; background:rgba(8,8,10,.96); display:none;
          flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:18px; }
  #view img { max-width:100%; max-height:78vh; border-radius:6px; }
  #view .row { display:flex; gap:10px; align-items:center; }
  #note { color:var(--dim); font-size:12px; margin-top:22px; border-top:1px solid var(--line);
          padding-top:14px; }
</style>
</head>
<body>
<header>
  <h1>SKIN BENCH</h1>
  <div class="sub">Drop a photo. Every look runs in this browser — nothing is uploaded, nothing is generated, nothing costs anything.</div>
</header>
<main>
  <label id="drop">
    <input type="file" accept="image/*">
    <div><strong>Drop a photo here</strong> or tap to choose one</div>
  </label>
  <div id="bar">
    <button id="again">Load another</button>
    <span class="sub" id="stat"></span>
  </div>
  <div id="grid"></div>
  <div id="note"></div>
</main>
<div id="view">
  <img id="big" alt="">
  <div class="row">
    <button id="dl">Download full size</button>
    <button id="close">Close</button>
  </div>
</div>
<script>
// ---------------------------------------------------------------------------------------------
// Every skin here is a pure pixel transform. No model, no network, no per-use cost, and the same
// input always gives the same output. That is the whole point: the expensive tier is only needed
// for looks that INVENT CONTENT (paint-by-number, cross stitch, low poly), and none of those are
// in this file.
// ---------------------------------------------------------------------------------------------
const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;
const lum = (r,g,b) => 0.299*r + 0.587*g + 0.114*b;

// Stretch to the 1st..99th percentile so a flat-lit photo still uses the whole range.
function levels(d) {
  const h = new Uint32Array(256);
  for (let i=0;i<d.length;i+=4) h[lum(d[i],d[i+1],d[i+2])|0]++;
  const n = d.length/4; let lo=0, hi=255, c=0;
  for (let i=0;i<256;i++){ c+=h[i]; if (c > n*0.01){ lo=i; break; } }
  c=0; for (let i=255;i>=0;i--){ c+=h[i]; if (c > n*0.01){ hi=i; break; } }
  return { lo, span: Math.max(hi-lo, 1) };
}
function grayOf(d, i, lv) { return Math.min(1, Math.max(0, (lum(d[i],d[i+1],d[i+2]) - lv.lo)/lv.span)); }

function px(ctx, w, h, fn) {
  const img = ctx.getImageData(0,0,w,h), d = img.data, lv = levels(d);
  for (let i=0;i<d.length;i+=4) fn(d, i, grayOf(d,i,lv), (i/4)%w, (i/4/w)|0);
  ctx.putImageData(img,0,0);
}
const duo = (loRGB, hiRGB) => (ctx,w,h) => px(ctx,w,h,(d,i,g)=>{
  d[i]   = clamp(hiRGB[0] + (loRGB[0]-hiRGB[0])*(1-g));
  d[i+1] = clamp(hiRGB[1] + (loRGB[1]-hiRGB[1])*(1-g));
  d[i+2] = clamp(hiRGB[2] + (loRGB[2]-hiRGB[2])*(1-g));
});
function ramp(stops) {
  return (ctx,w,h) => px(ctx,w,h,(d,i,g)=>{
    const t = g*(stops.length-1), k = Math.min(stops.length-2, t|0), f = t-k;
    for (let c=0;c<3;c++) d[i+c] = clamp(stops[k][c] + (stops[k+1][c]-stops[k][c])*f);
  });
}
function noise(ctx,w,h,amt,seed){
  let s = seed||1; const img=ctx.getImageData(0,0,w,h), d=img.data;
  for (let i=0;i<d.length;i+=4){
    s = (s*1664525 + 1013904223) & 0xffffffff;
    const n = ((s>>>16)/65535 - 0.5)*amt;
    d[i]=clamp(d[i]+n); d[i+1]=clamp(d[i+1]+n); d[i+2]=clamp(d[i+2]+n);
  }
  ctx.putImageData(img,0,0);
}

const SKINS = [
  // ---- print ------------------------------------------------------------------------------
  ['Halftone', (ctx,w,h)=>{
    const src = ctx.getImageData(0,0,w,h), d = src.data, lv = levels(d);
    ctx.fillStyle='#f2f0ea'; ctx.fillRect(0,0,w,h); ctx.fillStyle='#111';
    // ⛔ The first build crushed to near 1-bit and lost the cabinet: the ink range ran 0..1 and
    //    solid black swallowed every dark area. Compressing to 0.06..0.86 keeps tone in BOTH ends.
    const cell = Math.max(4, Math.round(Math.min(w,h)/120));
    const a = 15*Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
    const diag = Math.ceil(Math.hypot(w,h)) + cell;
    for (let v=-diag; v<diag; v+=cell) for (let u=-diag; u<diag; u+=cell) {
      const x = u*ca - v*sa + w/2, y = u*sa + v*ca + h/2;
      if (x<0||y<0||x>=w||y>=h) continue;
      const i = (((y|0)*w)+(x|0))*4;
      const ink = 0.06 + (1 - grayOf(d,i,lv))*0.80;
      const r = cell*0.72*Math.sqrt(ink);
      if (r < 0.35) continue;
      ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
    }
  }],
  ['Newsprint', (ctx,w,h)=>{ px(ctx,w,h,(d,i,g)=>{ const v = g>0.5?238:26;
      d[i]=v; d[i+1]=v; d[i+2]=v; }); noise(ctx,w,h,26,9); }],
  ['Risograph', (ctx,w,h)=>{
    const src = ctx.getImageData(0,0,w,h), d = src.data, lv = levels(d);
    const out = ctx.createImageData(w,h), o = out.data;
    const off = Math.max(1, Math.round(w/260));            // deliberate misregistration
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const xs = Math.min(w-1, x+off), is=(y*w+xs)*4;
      const g = grayOf(d,i,lv), g2 = grayOf(d,is,lv);
      o[i]   = clamp(245 - (1-g2)*205);
      o[i+1] = clamp(238 - (1-g)*228);
      o[i+2] = clamp(232 - (1-g)*90);
      o[i+3] = 255;
    }
    ctx.putImageData(out,0,0);
  }],
  ['Blueprint', (ctx,w,h)=>{
    const src = ctx.getImageData(0,0,w,h), d = src.data, lv = levels(d);
    const out = ctx.createImageData(w,h), o = out.data;
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const gx = grayOf(d,(y*w+Math.min(w-1,x+1))*4,lv) - grayOf(d,(y*w+Math.max(0,x-1))*4,lv);
      const gy = grayOf(d,(Math.min(h-1,y+1)*w+x)*4,lv) - grayOf(d,(Math.max(0,y-1)*w+x)*4,lv);
      const e = Math.min(1, Math.hypot(gx,gy)*3.2);
      o[i]   = clamp(22  + e*210);
      o[i+1] = clamp(58  + e*195);
      o[i+2] = clamp(122 + e*130);
      o[i+3] = 255;
    }
    ctx.putImageData(out,0,0);
  }],
  // ---- darkroom ---------------------------------------------------------------------------
  ['Cyanotype', (ctx,w,h)=>{ duo([12,46,92],[222,226,214])(ctx,w,h); noise(ctx,w,h,12,3); }],
  ['Sepia Print', (ctx,w,h)=>{ duo([44,28,16],[236,222,192])(ctx,w,h); noise(ctx,w,h,10,5); }],
  ['Solarised', (ctx,w,h)=>px(ctx,w,h,(d,i,g)=>{
      const s = g<0.5 ? g*2 : (1-g)*2, v = clamp(s*255);
      d[i]=v; d[i+1]=clamp(v*0.94); d[i+2]=clamp(v*0.82); })],
  ['Photogram', (ctx,w,h)=>px(ctx,w,h,(d,i,g)=>{
      const v = clamp((1-g)*255); d[i]=v; d[i+1]=v; d[i+2]=v; })],
  ['Redscale', (ctx,w,h)=>px(ctx,w,h,(d,i,g)=>{
      d[i]=clamp(40+g*215); d[i+1]=clamp(g*g*150); d[i+2]=clamp(g*g*g*70); })],
  // ---- screen -----------------------------------------------------------------------------
  ['CRT Scan', (ctx,w,h)=>{
    const src=ctx.getImageData(0,0,w,h), d=src.data;
    const out=ctx.createImageData(w,h), o=out.data;
    const sh = Math.max(1, Math.round(w/300));
    for (let y=0;y<h;y++){
      // ⛔ First version was barely visible (mean delta 16). Alternate lines now go to 0.42 and
      //    the chroma split scales with width instead of a fixed 2px.
      const line = (y%3===0) ? 0.42 : 1.10;
      for (let x=0;x<w;x++){
        const i=(y*w+x)*4;
        const ir=(y*w+Math.max(0,x-sh))*4, ib=(y*w+Math.min(w-1,x+sh))*4;
        o[i]   = clamp(d[ir]*line);
        o[i+1] = clamp(d[i+1]*line);
        o[i+2] = clamp(d[ib+2]*line);
        o[i+3] = 255;
      }
    }
    ctx.putImageData(out,0,0); noise(ctx,w,h,20,11);
  }],
  ['Teletext', (ctx,w,h)=>{
    const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    const pal=[[16,16,24],[214,32,48],[42,168,92],[228,196,42],[46,96,208],[226,226,222]];
    px(ctx,w,h,(d,i,g,x,y)=>{
      const t = bayer[y&3][x&3]/16 - 0.5;
      let best=0, bd=1e9;
      const tgt=[clamp(d[i]+t*70), clamp(d[i+1]+t*70), clamp(d[i+2]+t*70)];
      for (let k=0;k<pal.length;k++){
        const dd=(pal[k][0]-tgt[0])**2+(pal[k][1]-tgt[1])**2+(pal[k][2]-tgt[2])**2;
        if (dd<bd){bd=dd;best=k;}
      }
      d[i]=pal[best][0]; d[i+1]=pal[best][1]; d[i+2]=pal[best][2];
    });
  }],
  ['Night Vision', (ctx,w,h)=>{
    px(ctx,w,h,(d,i,g,x,y)=>{
      const cx=(x/w-0.5)*2, cy=(y/h-0.5)*2;
      const vig = Math.max(0, 1 - (cx*cx+cy*cy)*0.62);
      const v = Math.pow(g,0.62)*vig;
      d[i]=clamp(v*40); d[i+1]=clamp(v*255); d[i+2]=clamp(v*70);
    });
    noise(ctx,w,h,44,17);
  }],
  ['Dead Pixels', (ctx,w,h)=>{
    let s=99; px(ctx,w,h,(d,i,g,x,y)=>{
      s=(s*1103515245+12345)&0x7fffffff;
      const r=(s>>>12)%1000;
      if (r<6){ d[i]=255; d[i+1]=0; d[i+2]=190; }
      else if (r<12){ d[i]=0; d[i+1]=0; d[i+2]=0; }
      else if ((x>>1)%2===0 && (y>>1)%2===0){ d[i]=clamp(d[i]*1.12); }
    });
  }],
  // ---- colour -----------------------------------------------------------------------------
  ['Thermal', ramp([[0,0,12],[58,12,102],[158,20,90],[226,74,30],[248,168,22],[255,248,196]])],
  ['Aerochrome', (ctx,w,h)=>{
    const src=ctx.getImageData(0,0,w,h), d=src.data;
    for (let i=0;i<d.length;i+=4){
      const r=d[i], g=d[i+1], b=d[i+2];
      d[i]=clamp(g*1.12); d[i+1]=clamp(b*0.92); d[i+2]=clamp(r*0.86);
    }
    ctx.putImageData(src,0,0);
  }],
  ['Blue Negative', (ctx,w,h)=>px(ctx,w,h,(d,i)=>{
      d[i]=clamp(255-d[i]*1.05); d[i+1]=clamp(245-d[i+1]); d[i+2]=clamp(255-d[i+2]*0.55); })],
  ['Posterise', (ctx,w,h)=>px(ctx,w,h,(d,i)=>{
      for (let c=0;c<3;c++) d[i+c] = Math.round(d[i+c]/56)*56; })],
  ['Silhouette', (ctx,w,h)=>px(ctx,w,h,(d,i,g)=>{
      // A luminance silhouette, not a segmented one: it only reads on a photo whose subject is
      // clearly darker or lighter than its ground. Named honestly for that reason.
      const on = g < 0.46;
      d[i]=on?18:236; d[i+1]=on?20:232; d[i+2]=on?26:220; })],
];

// ---------------------------------------------------------------------------------------------
const $ = s => document.querySelector(s);
const grid = $('#grid'), drop = $('#drop'), input = drop.querySelector('input');
let sourceImg = null;

function draw(skin, cv, img, maxDim) {
  const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(img, 0, 0, w, h);
  skin[1](ctx, w, h);
}

function render(img) {
  sourceImg = img; window.__lastImg = img;
  grid.innerHTML = '';
  drop.style.display = 'none';
  $('#bar').style.display = 'flex';
  const t0 = performance.now();
  SKINS.forEach(skin => {
    const fig = document.createElement('figure');
    const cv = document.createElement('canvas');
    const cap = document.createElement('figcaption');
    cap.textContent = skin[0];
    fig.append(cv, cap); grid.append(fig);
    draw(skin, cv, img, 420);
    cv.onclick = () => open(skin);
  });
  $('#stat').textContent =
    SKINS.length + ' skins in ' + Math.round(performance.now()-t0) + ' ms, 0 generations';
  $('#note').textContent =
    'All ' + SKINS.length + ' are pure pixel transforms running on this device. ' +
    'Nothing was uploaded and no model was called. Looks that invent content — paint by number, ' +
    'cross stitch, low poly, toon — cannot be done this way and would each cost a generation.';
}

function open(skin) {
  const cv = document.createElement('canvas');
  draw(skin, cv, sourceImg, 2400);
  $('#big').src = cv.toDataURL('image/png');
  $('#dl').onclick = () => {
    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = skin[0].toLowerCase().replace(/\s+/g,'-') + '.png';
    a.click();
  };
  $('#view').style.display = 'flex';
}
$('#close').onclick = () => $('#view').style.display = 'none';
$('#again').onclick = () => { drop.style.display=''; $('#bar').style.display='none';
                              grid.innerHTML=''; $('#note').textContent=''; };

function load(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  img.onload = () => render(img);
  img.src = URL.createObjectURL(file);
}
input.onchange = e => load(e.target.files[0]);
['dragenter','dragover'].forEach(k => drop.addEventListener(k, e => {
  e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(k => drop.addEventListener(k, e => {
  e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => load(e.dataTransfer.files[0]));
window.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items||[])].find(i => i.type.startsWith('image/'));
  if (it) load(it.getAsFile());
});
window.__skinCount = SKINS.length;   // handle for the test harness
window.__loadTestImage = render;
</script>
</body>
</html>
